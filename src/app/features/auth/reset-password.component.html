<nav class="gear-nav">
  <a class="brand"><span class="dot"></span> Rider Intercom</a>
</nav>

<section class="login-screen">
  <div class="login-hero">
    <svg class="route" viewBox="0 0 600 800" preserveAspectRatio="none">
      <path d="M -20 40 C 150 100, 80 250, 260 300 S 450 500, 380 620 S 550 740, 620 800" stroke="#f2ead9" stroke-width="2" stroke-dasharray="10 14" fill="none" opacity="0.15"/>
      <circle cx="-20" cy="40" r="4" fill="#ffb020" opacity="0.6"/>
      <circle cx="260" cy="300" r="4" fill="#ffb020" opacity="0.6"/>
      <circle cx="380" cy="620" r="4" fill="#59a874" opacity="0.6"/>
    </svg>
    <div>
      <div class="mile-tag">New Password</div>
      <h1 class="hero-headline">Fresh.<br>Secure.<br><span>Ride.</span></h1>
      <p class="hero-sub">Choose a new password for your Rider Intercom account.</p>
    </div>
  </div>

  <div class="login-formside">
    <div class="console">
      <h2>Reset Password</h2>
      <p class="tag">Choose a new password</p>

      <form (ngSubmit)="submit()">
        <div class="field">
          <label for="new-password">New Password</label>
          <div class="password-wrapper">
            <input id="new-password" [type]="showPassword ? 'text' : 'password'"
                   name="newPassword" placeholder="At least 8 characters"
                   [(ngModel)]="newPassword" minlength="8" required>
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path *ngIf="!showPassword" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle *ngIf="!showPassword" cx="12" cy="12" r="2.5"/><path *ngIf="showPassword" d="M3 3l18 18M10.6 6.2C11.05 6.07 11.52 6 12 6c6 0 9.5 6 9.5 6a16.6 16.6 0 0 1-3.15 3.55M6.35 6.35C3.95 8.05 2.5 12 2.5 12s3.5 6 9.5 6c.65 0 1.27-.06 1.86-.17"/> </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-wrapper">
            <input id="confirm-password" [type]="showConfirmPassword ? 'text' : 'password'"
                   name="confirmPassword" placeholder="Repeat your new password"
                   [(ngModel)]="confirmPassword" required>
            <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword"
                    [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path *ngIf="!showConfirmPassword" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle *ngIf="!showConfirmPassword" cx="12" cy="12" r="2.5"/><path *ngIf="showConfirmPassword" d="M3 3l18 18M10.6 6.2C11.05 6.07 11.52 6 12 6c6 0 9.5 6 9.5 6a16.6 16.6 0 0 1-3.15 3.55M6.35 6.35C3.95 8.05 2.5 12 2.5 12s3.5 6 9.5 6c.65 0 1.27-.06 1.86-.17"/> </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading" class="button-content">Reset Password →</span>
          <span *ngIf="isLoading" class="button-loading">
            <span class="button-spinner" aria-hidden="true"></span>
            Resetting...
          </span>
        </button>
      </form>

      <div class="foot-link"><a routerLink="/login">← Back to login</a></div>
    </div>
  </div>
</section>
